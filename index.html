<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e4e8f0;--accent:#5b61e6;--accent2:#eef0ff;--green:#13845b;--amber:#a45b00;--red:#b42318;--shadow:0 8px 28px rgba(26,38,68,.07)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eff3ff,#f7f9fc 180px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#141c31,#343d79);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:.16em;opacity:.8;font-weight:800}.tag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 10px;font-size:11px}.hero h1{margin:14px 0 8px;font-size:clamp(2rem,4vw,3.2rem);line-height:1.1}.hero p{max-width:700px;margin:0;color:rgba(255,255,255,.86)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:#fff;box-shadow:0 10px 18px rgba(91,97,230,.2)}.btn.secondary{background:var(--accent2);color:#3947d7}.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px}.nav button{padding:10px 14px;border:none;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.nav button.active{background:var(--accent2);color:var(--accent);border-color:rgba(91,97,230,.18)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);grid-column:span 12}.card h2{margin:0 0 12px;font-size:1.08rem}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.st
